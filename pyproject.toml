[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitsune-bot"
version = "0.4.0"
description = "Kitsune: a talking fox-girl anime bot for Vector (Ollama chat, NovelAI voice and images, lip-synced avatar)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "vector-sdk-py @ git+https://github.com/lucky-edgelord/vector-sdk-py",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10",
    "novelai-sdk>=0.15",
]

[project.optional-dependencies]
emotion = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
kitsune = "kitsune.__main__:main"

[project.urls]
Homepage = "https://github.com/lucky-edgelord/Kitsune"
Issues = "https://github.com/lucky-edgelord/Kitsune/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kitsune = ["persona/*.md", "assets/sprites/*/*.png", "assets/avatar.png"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008", "B905"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["bot: needs vector-sdk-py installed"]
